<!doctype html>
<html lang="es">
<head>
<meta name="color-scheme" content="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Reminder 🎀</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #191919;
  margin: 0;
  color: #fff7fb;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
  .card {
    width:min(760px, 100%);
    min-height:230px;
    border-radius:24px;
    padding:30px 34px 24px;
    background: linear-gradient(145deg, #55213f, #351426);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 18px 55px rgba(0,0,0,.22);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:22px;
  }
  .eyebrow {
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:.72;
    font-weight:700;
  }
  #quote {
    margin:0;
    font-family: Georgia, "Times New Roman", serif;
    font-size:clamp(25px, 4.5vw, 39px);
    line-height:1.16;
    text-wrap:balance;
  }
  .bottom {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .signature {
    font-size:12px;
    opacity:.55;
  }
  button {
    appearance:none;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(255,255,255,.09);
    color:#fff7fb;
    padding:10px 15px;
    cursor:pointer;
    font:600 12px/1 inherit;
  }
  button:hover { background:rgba(255,255,255,.15); }
  @media (max-width:520px) {
    .card { padding:25px 23px 21px; min-height:250px; }
    .bottom { align-items:flex-end; }
    .signature { display:none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">CEO Reminder 🎀</div>
    <blockquote id="quote"></blockquote>
    <div class="bottom">
      <span class="signature">de Gracie para Gracie</span>
      <button id="next" type="button">Necesito otro recordatorio 🎀</button>
    </div>
  </main>

<script>
  // PARA AGREGAR FRASES:
  // Añade una nueva línea dentro de esta lista, entre comillas y seguida de coma.
  const quotes = [
        'Haz lo que quieres sin renunciar a partes de ti.',
        'Creativa de corazón, CEO de cerebro e intencional hasta el último moñito. 🎀✨',
        'No tengo un nicho. Tengo un universo. 🎀',
        'Necesitas cambiar el contexto para descubrir de qué eres capaz.',
        'No esperes que llegue exactamente como lo imaginaste. Reconoce las oportunidades que te están llevando hacia allá.',
        'Yo provoco el resultado que busco.',
        'Una vez que puedo visualizarlo, solo necesito empezar a actuar para convertirlo en realidad.'
  ];

  const quote = document.getElementById("quote");
  const next = document.getElementById("next");
  let current = -1;

  function showQuote() {
    if (!quotes.length) return;
    let index;
    do {
      index = Math.floor(Math.random() * quotes.length);
    } while (quotes.length > 1 && index === current);
    current = index;
    quote.textContent = quotes[current];
  }

  next.addEventListener("click", showQuote);
  showQuote();
</script>
</body>
</html>
